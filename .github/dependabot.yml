version: 2
updates:
  # Mantiene las GitHub Actions ancladas por SHA al día (actualiza SHA y comentario).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Vigila las dependencias de desarrollo declaradas en pyproject.toml.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: deps
