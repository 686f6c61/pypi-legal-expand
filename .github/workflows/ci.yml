# legal-expand - GitHub Action para CI (tests automaticos)
#
# @author https://github.com/686f6c61
# @repository https://github.com/686f6c61/pypi-legal-expand
# @license MIT
# @date 12/2025
#
# Este workflow ejecuta los tests automaticamente en cada push y PR.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests with coverage
        run: pytest tests/ -v --cov=legal_expand --cov-report=term-missing --cov-fail-under=90

      - name: Check package builds correctly
        run: |
          pip install build
          python -m build

      - name: Smoke test wheel install
        run: |
          python -m venv /tmp/legal-expand-wheel
          /tmp/legal-expand-wheel/bin/python -m pip install --upgrade pip
          /tmp/legal-expand-wheel/bin/python -m pip install dist/*.whl
          /tmp/legal-expand-wheel/bin/python -c "from legal_expand import __version__, expandir_siglas; assert __version__ == '1.6.0'; assert 'Agencia Estatal' in expandir_siglas('AEAT')"
          /tmp/legal-expand-wheel/bin/legal-expand info

  lint:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy bandit
          pip install -e .

      - name: Lint with Ruff
        run: ruff check src/

      - name: Type check with mypy
        run: mypy src/legal_expand

      - name: Security check with Bandit
        run: bandit -r src/legal_expand -ll
