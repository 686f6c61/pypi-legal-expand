# legal-expand - GitHub Action para publicar en PyPI
#
# @author https://github.com/686f6c61
# @repository https://github.com/686f6c61/pypi-legal-expand
# @license MIT
# @date 12/2025
#
# Este workflow publica automaticamente el paquete en PyPI cuando:
# 1. Se crea un release en GitHub, o
# 2. Se hace push de un tag con formato v*.*.*
#
# CONFIGURACION REQUERIDA:
# 1. Crear API token en https://pypi.org/manage/account/token/
# 2. Añadir el token como secret en GitHub:
#    Settings > Secrets and variables > Actions > New repository secret
#    Nombre: PYPI_API_TOKEN
#    Valor: pypi-XXXXXXXXXX...

name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*.*.*'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -e .

      - name: Run tests
        run: pytest tests/ -v --tb=short

  publish:
    name: Build and publish to PyPI
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build package
        run: python -m build

      - name: Check package
        run: twine check dist/*

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: twine upload dist/*
